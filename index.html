<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos por voz</title>

  <!-- Instalable en la pantalla de inicio: se abre sin las barras de Safari -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastos">

  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
      max-width: 520px;
    }
    button { font-size: 1.1rem; padding: 14px; border-radius: 12px; }
    #boton { font-size: 1.4rem; width: 100%; padding: 24px; }
    #boton.grabando { background: #c62828; color: #fff; }
    .acciones { display: flex; gap: 8px; margin: 12px 0; }
    .acciones button { flex: 1; }
    label, select { font-size: 1rem; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
    dt { font-weight: 600; }
    dd { margin: 0; word-break: break-word; }
    ul { margin: 4px 0 12px; padding-left: 20px; }
    .error { color: #c62828; }
    .oculto { display: none; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Gastos por voz · prueba</h1>

  <p>
    <label for="modelo">Modelo</label>
    <select id="modelo">
      <option value="whisper-large-v3">whisper-large-v3</option>
      <option value="whisper-large-v3-turbo">whisper-large-v3-turbo</option>
    </select>
  </p>
  <!-- Temporal (hasta la 6.4): comparar la transcripción con y sin vocabulario -->
  <p>
    <label><input type="checkbox" id="vocabulario"> Usar vocabulario</label>
  </p>

  <button id="boton" type="button">Grabar</button>
  <p id="estado">Listo</p>

  <!-- Vista previa: nada se guarda hasta pulsar Guardar -->
  <section id="previa" class="oculto">
    <h2>Vista previa</h2>
    <p><small>Has dicho: «<span id="texto"></span>»</small></p>
    <dl id="datos"></dl>
    <div id="listas"></div>
    <div class="acciones">
      <button id="guardar" type="button">Guardar</button>
      <button id="corregir" type="button">Corregir por voz</button>
      <button id="descartar" type="button">Descartar</button>
    </div>
  </section>

  <section id="resultado" class="oculto">
    <p id="resultado-texto"></p>
    <button id="deshacer" type="button">Deshacer</button>
  </section>

  <h2>Tiempos</h2>
  <dl>
    <dt>ms_vocabulario</dt><dd id="ms-vocabulario">—</dd>
    <dt>ms_groq</dt><dd id="ms-groq">—</dd>
    <dt>ms_interpretar</dt><dd id="ms-interpretar">—</dd>
    <dt>Total</dt><dd id="ms-total">—</dd>
    <!-- Temporal (hasta la 6.4): máxima probabilidad de "no hay voz" entre los segmentos -->
    <dt>Prob. sin voz</dt><dd id="prob-sin-voz">—</dd>
  </dl>

  <p><a href="#" id="borrar-token">Borrar token</a></p>

  <!-- ?v= obliga al navegador a descargar los scripts nuevos en cada versión -->
  <script src="config.js?v=6.2.1"></script>
  <script src="app.js?v=6.2.1"></script>
</body>
</html>
