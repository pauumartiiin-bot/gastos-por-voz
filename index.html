<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos por voz</title>

  <!-- Tema antes de pintar nada, para evitar un parpadeo del tema equivocado -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('gastos_tema'); } catch (e) {}
      if (t !== 'claro' && t !== 'oscuro') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      }
      document.documentElement.dataset.tema = t;
    })();
  </script>

  <!-- Instalable en la pantalla de inicio: se abre sin las barras de Safari -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <meta name="theme-color" content="#F4EEE4">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
  <!-- ?v= obliga al navegador a descargar los archivos nuevos en cada versión -->
  <link rel="stylesheet" href="styles.css?v=6.3.1">
</head>
<body>
  <div class="halo halo-a" aria-hidden="true"></div>
  <div class="halo halo-b" aria-hidden="true"></div>

  <main class="app">
    <header class="cabecera">
      <h1>Gastos</h1>
      <button id="tema" class="icono-btn" type="button" aria-label="Cambiar a modo oscuro">
        <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <!-- Primera vez: pedir el token (se guarda solo en este dispositivo) -->
    <section id="vista-token" class="tarjeta oculto" aria-labelledby="titulo-token">
      <h2 id="titulo-token">Conecta la app</h2>
      <p class="aviso">Pega el token de tu Apps Script. Se guarda solo en este dispositivo.</p>
      <form id="form-token" style="display: flex; flex-direction: column; gap: 14px">
        <label class="campo" for="campo-token">Token
          <input id="campo-token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        </label>
        <button class="btn-primario" type="submit">Guardar token</button>
      </form>
    </section>

    <!-- Dictar -->
    <section id="vista-dictar" class="oculto" style="display: flex; flex-direction: column; gap: 20px">
      <div class="grabar">
        <button id="boton" class="btn-grabar" type="button" aria-label="Grabar">
          <svg class="icono-micro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>
          <svg class="icono-parar" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
        </button>
        <div id="nivel" class="nivel" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <p id="estado" class="estado" role="status" aria-live="polite">Toca y di tu gasto</p>
      </div>

      <!-- Vista previa: nada se guarda hasta pulsar Guardar -->
      <article id="previa" class="tarjeta tarjeta-degradado oculto" aria-label="Vista previa del gasto">
        <p class="dicho">Has dicho «<span id="texto"></span>»</p>
        <div class="titular">
          <span id="concepto" class="concepto"></span>
          <span id="importe" class="importe"></span>
        </div>
        <div id="chips" class="chips"></div>
        <div id="avisos" style="display: flex; flex-direction: column; gap: 10px"></div>
        <button id="guardar" class="btn-primario" type="button">Guardar</button>
        <div class="fila">
          <button id="corregir" class="btn-suave" type="button">Corregir por voz</button>
          <button id="descartar" class="btn-borde" type="button">Descartar</button>
        </div>
      </article>

      <div id="resultado" class="tarjeta resultado oculto">
        <p id="resultado-texto"></p>
        <button id="deshacer" class="btn-suave" type="button">Deshacer</button>
      </div>

      <!-- Modo pruebas (hasta la 6.4): parámetros y medidas -->
      <section id="pruebas" class="tarjeta pruebas oculto" aria-labelledby="titulo-pruebas">
        <h2 id="titulo-pruebas">Modo pruebas</h2>
        <label class="campo" for="modelo">Modelo
          <select id="modelo">
            <option value="whisper-large-v3">whisper-large-v3</option>
            <option value="whisper-large-v3-turbo">whisper-large-v3-turbo</option>
          </select>
        </label>
        <label class="ajuste" for="vocabulario">Usar vocabulario <input type="checkbox" id="vocabulario"></label>
        <dl>
          <dt>Volumen máx.</dt><dd id="vol-max">—</dd>
          <dt>ms_vocabulario</dt><dd id="ms-vocabulario">—</dd>
          <dt>ms_groq</dt><dd id="ms-groq">—</dd>
          <dt>ms_interpretar</dt><dd id="ms-interpretar">—</dd>
          <dt>Total</dt><dd id="ms-total">—</dd>
          <dt>Prob. sin voz</dt><dd id="prob-sin-voz">—</dd>
        </dl>
      </section>
    </section>

    <!-- Mis registros (llega en la 6.3b) + ajustes -->
    <section id="vista-registros" class="oculto" style="display: flex; flex-direction: column; gap: 20px">
      <div id="aviso-registros" class="tarjeta resultado oculto">
        <p id="aviso-registros-texto"></p>
        <button id="deshacer-registro" class="btn-suave" type="button">Deshacer</button>
      </div>
      <p id="estado-registros" class="estado" role="status" aria-live="polite"></p>

      <section class="seccion" aria-labelledby="titulo-recurrentes">
        <h2 id="titulo-recurrentes" class="titulo-seccion">Recurrentes</h2>
        <div id="lista-recurrentes" class="lista"></div>
      </section>

      <section class="seccion" aria-labelledby="titulo-movimientos">
        <h2 id="titulo-movimientos" class="titulo-seccion">Últimos gastos</h2>
        <div id="lista-movimientos" class="lista"></div>
      </section>

      <div class="tarjeta" aria-label="Ajustes">
        <h2>Ajustes</h2>
        <label class="ajuste" for="modo-pruebas">Modo pruebas <input type="checkbox" id="modo-pruebas"></label>
        <button id="borrar-token" class="enlace" type="button">Borrar el token de este dispositivo</button>
      </div>
    </section>
  </main>

  <nav id="barra" class="barra oculto" aria-label="Secciones">
    <button type="button" data-vista="dictar" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>
      Dictar
    </button>
    <button type="button" data-vista="registros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Mis registros
    </button>
  </nav>

  <script src="config.js?v=6.3.1"></script>
  <script src="app.js?v=6.3.1"></script>
</body>
</html>
