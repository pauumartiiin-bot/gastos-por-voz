<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Fuente del icono: "euro que suena" en vino con degradado y onda lavanda.
       Cuadrado sin esquinas redondeadas: iOS aplica su propia máscara. -->
  <defs>
    <linearGradient id="vino" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A3F6A"/>
      <stop offset="1" stop-color="#5A1F3D"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="url(#vino)"/>
  <!-- € dibujado como trazos (no como texto) para no depender de ninguna fuente -->
  <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
    <path d="M86 56 A30 30 0 1 0 86 104"/>
    <path d="M30 73 H70"/>
    <path d="M30 89 H66"/>
  </g>
  <path d="M106 62 A26 26 0 0 1 106 98" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <path d="M118 50 A42 42 0 0 1 118 110" fill="none" stroke="#BDB1EC" stroke-width="8" stroke-linecap="round"/>
</svg>
